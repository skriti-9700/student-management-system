<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Student Management System</title>
</head>

<body>
    <h1>Student Management System</h1>

    <a href="{{ url_for('create_student') }}">Add Student</a>

    <h2>All Students</h2>

    <table id="all-students" border="1">
        <thead>
            <tr>
                <th>SNo</th>
                <th>Roll Number</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>
                    <a href="{{ url_for('student_details', student_id=student.student_id) }}">
                        {{ student.roll_number }}
                    </a>
                </td>
                <td>{{ student.first_name }}</td>
                <td>{{ student.last_name or '' }}</td>
                <td>
                    <a href="{{ url_for('update_student', student_id=student.student_id) }}">Update</a>
                    |
                    <a href="{{ url_for('delete_student', student_id=student.student_id) }}">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
