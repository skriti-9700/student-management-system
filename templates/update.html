<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Update Student</title>
</head>

<body>
    <h1>Update Student</h1>

    <form id="update-form" action="{{ url_for('update_student', student_id=student.student_id) }}" method="POST">

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" value="{{ student.roll_number }}" disabled>
        <br><br>

        <label for="f_name">First Name:</label>
        <input type="text" id="f_name" name="f_name" value="{{ student.first_name }}" required>
        <br><br>

        <label for="l_name">Last Name:</label>
        <input type="text" id="l_name" name="l_name" value="{{ student.last_name or '' }}">
        <br><br>

        <h3>Select Courses:</h3>

        {% for course in courses %}
        <input type="checkbox" id="course_{{ course.course_id }}" name="courses" value="course_{{ course.course_id }}"
            {% if course.course_id in existing_ids %}checked{% endif %}>
        <label for="course_{{ course.course_id }}">
            {{ course.course_name }}
        </label>
        <br>
        {% endfor %}

        <br>
        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="/">Go Back</a>
</body>

</html>
